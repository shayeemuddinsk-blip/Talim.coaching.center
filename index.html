html::-webkit-scrollbar,body::-webkit-scrollbar,.content::-webkit-scrollbar,.nav::-webkit-scrollbar,.table-wrap::-webkit-scrollbar,.modal::-webkit-scrollbar,.modal-body::-webkit-scrollbar{width:0;height:0}

#loginView{visibility:hidden}

/* Professional startup loader */
#startupLoader{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#dff8f4,transparent 38%),linear-gradient(135deg,#eef8f6,#ffffff);transition:opacity .28s ease,visibility .28s ease}
#startupLoader.hide{opacity:0;visibility:hidden;pointer-events:none}
.startup-box{text-align:center;padding:28px;min-width:220px}
.startup-logo{width:92px;height:92px;margin:0 auto 18px;border-radius:22px;background:#fff;box-shadow:0 14px 45px rgba(7,63,53,.14);display:grid;place-items:center;overflow:hidden}
.startup-logo img{width:100%;height:100%;object-fit:contain}
.startup-logo-fallback{font-size:30px;font-weight:850;color:var(--primary2)}
.startup-title{font-size:17px;font-weight:800;color:var(--text)}
.startup-loading{margin:14px auto 0;width:180px;height:6px;background:#dfece9;border-radius:99px;overflow:hidden}
.startup-loading i{display:block;width:45%;height:100%;background:var(--primary);border-radius:99px;animation:startupProgress 1.15s ease-in-out infinite}
.startup-status{margin-top:9px;font-size:12px;color:var(--muted)}
@keyframes startupProgress{0%{transform:translateX(-120%)}50%{transform:translateX(120%)}100%{transform:translateX(350%)}}
</style>
</head>
<body>
<div id="startupLoader"><div class="startup-box"><div class="startup-logo" id="startupLogo"><span class="startup-logo-fallback">TC</span></div><div class="startup-title" id="startupTitle">Tuition Management</div><div class="startup-loading"><i></i></div><div class="startup-status">Loading…</div></div></div>
<div id="loginView" class="login">
  <div class="login-box">
    <div class="login-brand"><div class="brandmark">TC</div><div><h2 id="loginTitle">Talim Coaching Center</h2><p id="loginSub">Sign in to continue</p></div></div>
    <div class="field"><label>Username / ID</label><input id="loginUser" autocomplete="username" placeholder="Enter username or ID"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn primary" onclick="login()">Sign In</button>
    <div class="login-note">Secure access to your tuition account</div>
  </div>

<script>
/* Code-controlled administrator account */
const DEFAULT_APP_NAME='Talim Coaching Center';
const DEFAULT_LOGO_URL='talim-logo.png';
const ADMIN_USERNAME='admin';
const ADMIN_PASSWORD='DCE@2026#Admin'; // Change administrator login here only
const SYNC_CHANNEL='dce_tuition_sync_v3';
const KEY='dce_tuition_v3';
const CLOUD_SYNC={enabled:true,apiUrl:'https://script.google.com/macros/s/AKfycbyV5y_mtF1WN1JuVO2XEwVEAV-JoRoFEvDitRn0yA1U3Fzqbv29r9UaxryeVZokXeGI/exec',timeout:20000};
const TABLE_KEYS=['students','teachers','batches','payments','attendance','marks','expenses','feeHistory','users','notices','materials','messages','feeCycles','promotions','activity'];
let cloudReady=false,cloudStatus='local',cloudBusy=false,cloudPollTimer=null,cloudLastMeta=null,cloudSaveTimer=null,cloudSavePending=false,cloudLastSnapshot=null;
const CLOUD_POLL_MS=5000,CLOUD_SAVE_DEBOUNCE_MS=500;
function cloudConfigured(){return CLOUD_SYNC.enabled&&/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(CLOUD_SYNC.apiUrl)}
async function cloudRequest(url,options={}){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),CLOUD_SYNC.timeout);try{const r=await fetch(url,{...options,signal:ctl.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const text=await r.text();let out;try{out=JSON.parse(text)}catch(e){throw new Error('Invalid server response: '+text.slice(0,200))}if(out?.ok===false)throw new Error(out.error||'Cloud API error');return out}finally{clearTimeout(timer)}}
function normalizeCloudData(raw){const d=raw&&typeof raw==='object'?raw:{};if(Array.isArray(d.settings))d.settings=d.settings[0]||{};d.settings={...clone(defaults?.settings||{}),...(d.settings||{})};TABLE_KEYS.forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});return d}
async function cloudLoad(updateSnapshot=true){if(!cloudConfigured())return null;try{const out=await cloudRequest(CLOUD_SYNC.apiUrl+'?action=get&_='+Date.now());const d=normalizeCloudData(out.data);cloudStatus='online';cloudLastMeta={...(out.meta||{}),revision:Number(out.revision||0)};if(updateSnapshot)cloudLastSnapshot=clone(d);return d}catch(e){console.warn('Cloud GET failed:',e);cloudStatus='offline';return null}}
async function cloudLoadTables(tables){if(!cloudConfigured()||!tables?.length)return null;try{const q=encodeURIComponent([...new Set(tables)].join(','));const out=await cloudRequest(CLOUD_SYNC.apiUrl+'?action=getTables&tables='+q+'&_='+Date.now());cloudStatus='online';cloudLastMeta={...(cloudLastMeta||{}),...(out.meta||{}),revision:Number(out.revision||cloudLastMeta?.revision||0)};return normalizeCloudData(out.data)}catch(e){console.warn('Cloud table load failed:',e);return null}}
async function cloudMeta(){if(!cloudConfigured())return null;try{const out=await cloudRequest(CLOUD_SYNC.apiUrl+'?action=meta&_='+Date.now());cloudStatus='online';return out.meta||{}}catch(e){return null}}
async function cloudUploadDataUrl(dataUrl,name,oldFileId){if(!cloudConfigured()||!String(dataUrl||'').startsWith('data:'))return null;try{return await cloudRequest(CLOUD_SYNC.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'uploadFile',dataUrl,name:name||'file',oldFileId:oldFileId||''})})}catch(e){console.warn('Cloud file upload failed:',e);toast('Google Drive upload failed');return null}}
async function cloudPrepareSnapshot(){const snap=clone(db);if(snap.settings?.logo&&String(snap.settings.logo).startsWith('data:')){const r=await cloudUploadDataUrl(snap.settings.logo,'tuition-logo.png',snap.settings.logoFileId||'');if(r?.url){snap.settings.logo=r.url;snap.settings.logoFileId=r.fileId;db.settings.logo=r.url;db.settings.logoFileId=r.fileId;localStorage.setItem(KEY,JSON.stringify(db));}}return snap}
function pickCloudKeys(obj,keys){const out={};(keys||[]).forEach(k=>{out[k]=clone(obj?.[k]??(k==='settings'?{}:[]))});return out}
function changedCloudKeys(base,current){const keys=[...TABLE_KEYS,'settings'];if(!base)return keys;return keys.filter(k=>JSON.stringify(base[k]??null)!==JSON.stringify(current[k]??null))}
async function cloudSaveNow(){if(!cloudConfigured()||!cloudReady||cloudBusy)return false;cloudBusy=true;try{const snapshot=await cloudPrepareSnapshot();const keys=changedCloudKeys(cloudLastSnapshot,snapshot);if(!keys.length)return true;const out=await cloudRequest(CLOUD_SYNC.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',data:snapshot,changed:keys,base:cloudLastSnapshot?pickCloudKeys(cloudLastSnapshot,keys):null})});if(out?.ok){cloudStatus='online';cloudLastMeta={...(out.meta||{}),revision:Number(out.revision||0)};db=snapshot;cloudLastSnapshot=clone(snapshot);localStorage.setItem(KEY,JSON.stringify(db));refreshSessionUser();if(currentUser)updateShell();return true}return false}catch(e){console.warn('Cloud SAVE failed:',e);cloudStatus='offline';return false}finally{cloudBusy=false;if(cloudSavePending){cloudSavePending=false;cloudSave()}}}
function cloudSave(){if(!cloudConfigured()||!cloudReady)return Promise.resolve(false);cloudSavePending=true;clearTimeout(cloudSaveTimer);return new Promise(resolve=>{cloudSaveTimer=setTimeout(async()=>{cloudSavePending=false;resolve(await cloudSaveNow())},CLOUD_SAVE_DEBOUNCE_MS)})}
async function cloudPatch(action,payload){if(!cloudConfigured())return null;try{const out=await cloudRequest(CLOUD_SYNC.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});cloudStatus='online';cloudLastMeta={...(cloudLastMeta||{}),...(out.meta||{}),revision:Number(out.revision||cloudLastMeta?.revision||0)};const d=await cloudLoad();if(d){db=d;cloudLastSnapshot=clone(d);localStorage.setItem(KEY,JSON.stringify(db));if(currentUser)render()}return out}catch(e){console.warn('Cloud patch failed:',e);return null}}
function mergeCloudTables(data){if(!data)return;const d=normalizeCloudData(data);Object.entries(d).forEach(([k,v])=>{if(k==='settings')db.settings={...db.settings,...(v||{})};else if(Array.isArray(v))db[k]=v});if(!db.settings.name||db.settings.name==='Data Click Education')db.settings.name=DEFAULT_APP_NAME;if(!db.settings.logo)db.settings.logo=DEFAULT_LOGO_URL;normalizeFinancialOverrides();localStorage.setItem(KEY,JSON.stringify(db));cloudLastSnapshot=clone(db);refreshSessionUser();buildNav();if(currentUser)render()}
async function cloudPoll(){if(!cloudConfigured()||!cloudReady||cloudBusy||document.visibilityState==='hidden')return;const meta=await cloudMeta();if(!meta)return;if(!cloudLastMeta){cloudLastMeta=meta;return}const map={Students:'students',Teachers:'teachers',Batches:'batches',Payments:'payments',Attendance:'attendance',Marks:'marks',Expenses:'expenses',FeeHistory:'feeHistory',Users:'users',Notices:'notices',Materials:'materials',Messages:'messages',FeeCycles:'feeCycles',Promotions:'promotions',Activity:'activity',Settings:'settings',Logo:'settings'};const changed=[];for(const [sheet,key] of Object.entries(map)){if(Number(meta[sheet]||0)!==Number(cloudLastMeta[sheet]||0)&&!changed.includes(key))changed.push(key)}if(changed.length){const data=await cloudLoadTables(changed);if(data)mergeCloudTables(data)}cloudLastMeta=meta}
function startCloudPolling(){clearInterval(cloudPollTimer);cloudPollTimer=setInterval(cloudPoll,CLOUD_POLL_MS)}
async function initCloudSync(){if(!cloudConfigured()){cloudReady=true;return}const remote=await cloudLoad();if(remote){db=remote;if(!db.settings)db.settings={};if(!db.settings.name||db.settings.name==='Data Click Education')db.settings.name=DEFAULT_APP_NAME;if(!db.settings.logo)db.settings.logo=DEFAULT_LOGO_URL;normalizeFinancialOverrides();localStorage.setItem(KEY,JSON.stringify(db));cloudLastSnapshot=clone(db)}else{cloudStatus='offline';console.warn('Google Sheets unavailable; local data kept until connection returns.')}cloudReady=true;startCloudPolling()}
async function cloudForceSaveAll(){if(!cloudConfigured()||!cloudReady)return false;cloudSavePending=false;clearTimeout(cloudSaveTimer);return await cloudSaveNow()}
async function cloudResetAll(){if(!cloudConfigured())return false;try{const out=await cloudRequest(CLOUD_SYNC.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'reset'})});if(out?.ok){cloudStatus='online';cloudLastMeta={...(out.meta||{}),revision:Number(out.revision||0)};return true}}catch(e){console.warn('Cloud reset failed:',e)}return false}

const defaults={
 settings:{name:'Talim Coaching Center',session:'2026-27',currency:'₹',timezone:'Asia/Kolkata',logo:'',userPermissions:{}},
 users:[{id:'ADM001',role:'admin',username:ADMIN_USERNAME,password:ADMIN_PASSWORD,name:'Super Administrator',active:true}],
 students:[],teachers:[],batches:[],payments:[],attendance:[],marks:[],expenses:[],notices:[],feeHistory:[],materials:[],messages:[],feeCycles:[],promotions:[],activity:[]
};
const DEFAULT_PERMISSIONS={teacher:{dashboard:true,students:true,promotions:true,batches:true,payments:false,feeHistory:false,expenses:false,finance:false,attendance:true,marks:true,notices:true,communication:true,materials:true,messages:true,messageDelete:true,noticeDelete:true,materialDelete:true,teachers:false,users:false,activity:false,settings:false,excel:false,recovery:false},student:{studentHome:true,myFees:true,myAttendance:true,myMarks:true,myNotices:true,materials:true,messages:true,messageDelete:false,noticeDelete:false,materialDelete:false,profile:true}};
let db=loadDB(), currentUser=null, currentPage='dashboard', searchTerm='';
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadDB(){try{const x=JSON.parse(localStorage.getItem(KEY)); if(x){const merged={...clone(defaults),...x,settings:{...defaults.settings,...x.settings}};merged.materials=Array.isArray(x.materials)?x.materials:[];merged.messages=Array.isArray(x.messages)?x.messages:[];merged.settings.permissions={teacher:{...DEFAULT_PERMISSIONS.teacher,...(x.settings?.permissions?.teacher||{})},student:{...DEFAULT_PERMISSIONS.student,...(x.settings?.permissions?.student||{})}};merged.settings.permissions.teacher.noticeDelete=!!merged.settings.permissions.teacher.noticeDelete;merged.settings.permissions.teacher.materialDelete=!!merged.settings.permissions.teacher.materialDelete;merged.settings.permissions.student.messageDelete=!!merged.settings.permissions.student.messageDelete;merged.settings.permissions.student.noticeDelete=!!merged.settings.permissions.student.noticeDelete;merged.settings.permissions.student.materialDelete=!!merged.settings.permissions.student.materialDelete;merged.settings.userPermissions=x.settings?.userPermissions||{};
      if(!merged.settings.name||merged.settings.name==='Data Click Education')merged.settings.name=DEFAULT_APP_NAME; if(!merged.settings.logo)merged.settings.logo=DEFAULT_LOGO_URL;
      merged.messages=merged.messages.map(m=>({
        ...m,
        fromRole:m.fromRole||((merged.students||[]).some(s=>s.id===m.fromId)?'student':((merged.teachers||[]).some(t=>t.id===m.fromId)?'teacher':((merged.users||[]).find(u=>u.id===m.fromId)?.role||'admin'))),
        toRole:m.toRole||((merged.students||[]).some(s=>s.id===m.toId)?'student':((merged.teachers||[]).some(t=>t.id===m.toId)?'teacher':((merged.users||[]).find(u=>u.id===m.toId)?.role||'admin'))),
        date:/^\d{4}-\d{2}-\d{2}/.test(String(m.date||''))?String(m.date).slice(0,10):String(m.date||today()).slice(0,10)
      }));
      merged.students=(merged.students||[]).map(st=>{const hasManual=st.manualPaidOverride!==null&&st.manualPaidOverride!==undefined;const actual=(merged.payments||[]).filter(p=>String(p.studentId)===String(st.id)).reduce((a,p)=>a+Math.max(0,Number(p.amount)||0),0);return {...st,manualPaidOverride:hasManual?Number(st.manualPaidOverride):null,manualDueOverride:(st.manualDueOverride!==null&&st.manualDueOverride!==undefined)?Number(st.manualDueOverride):null,paid:hasManual?Number(st.manualPaidOverride):actual};});
      db=merged; normalizeFinancialOverrides(); return db}}catch(e){} const d=clone(defaults);d.settings.permissions=clone(DEFAULT_PERMISSIONS);return d}
function save(){localStorage.setItem(KEY,JSON.stringify(db));cloudSave();try{window.dceSyncChannel?.postMessage({type:'data-updated',at:Date.now()})}catch(e){}}
async function cloudForceSaveAll(){
  if(!cloudConfigured())return false;
  try{
    const meta=await cloudMeta();
    if(meta)cloudLastMeta={...(cloudLastMeta||{}),...meta,revision:Number(meta.revision||cloudLastMeta?.revision||0)};
    cloudReady=true;
    if(!cloudLastSnapshot){const remote=await cloudLoad(true);if(remote)db=remote;}
    cloudSavePending=false;
    clearTimeout(cloudSaveTimer);
    return await cloudSaveNow();
  }catch(e){console.warn('Cloud force save failed:',e);return false}
}
async function cloudResetAll(){
  if(!cloudConfigured())return false;
  try{
    const out=await cloudRequest(CLOUD_SYNC.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'reset'})});
    if(out?.ok){
      cloudStatus='online';
      cloudLastMeta={...(out.meta||{}),revision:Number(out.revision||out.meta?.revision||1)};
      cloudLastSnapshot=clone(db);
      return true;
    }
  }catch(e){console.warn('Cloud reset failed:',e)}
  cloudStatus='offline';
  return false;
}
function saveSession(){if(currentUser)localStorage.setItem('dce_session_user',JSON.stringify({id:currentUser.id,role:currentUser.role,username:currentUser.username}));}
function clearSession(){localStorage.removeItem('dce_session_user');sessionStorage.removeItem('dce_user')}
function resolveUser(id){if(!id)return null;if(id==='ADM001')return {id:'ADM001',role:'admin',username:ADMIN_USERNAME,password:ADMIN_PASSWORD,name:'Super Administrator',active:true};let u=db.users.find(x=>String(x.id)===String(id));if(u&&u.active!==false){if(u.role==='student'){const s=db.students.find(x=>String(x.id)===String(id));if(s&&s.status==='left')return null;return {...u,name:s?.name||u.name||u.id,active:true,username:u.username||s?.username||u.id,password:u.password||s?.password||'123456'}}if(u.role==='teacher'){const t=db.teachers.find(x=>String(x.id)===String(id));if(t&&t.active===false)return null;return {...u,name:t?.name||u.name||u.id,active:true,username:u.username||t?.username||u.id,password:u.password||t?.password||'123456'}}if(u.role==='admin')return u}const s=db.students.find(x=>String(x.id)===String(id)||String(x.username||'')===String(id));if(s&&s.status!=='left')return {id:s.id,role:'student',username:s.username||s.id,password:s.password||'123456',name:s.name,active:true};const t=db.teachers.find(x=>String(x.id)===String(id)||String(x.username||'')===String(id));if(t&&t.active!==false)return {id:t.id,role:'teacher',username:t.username||t.id,password:t.password||'123456',name:t.name,active:true};return null}
function applyBranding(){const name=(db.settings&&db.settings.name)||DEFAULT_APP_NAME;const logo=(db.settings&&db.settings.logo)||DEFAULT_LOGO_URL;const loginTitle=document.getElementById('loginTitle');if(loginTitle)loginTitle.textContent=name;const startupTitle=document.getElementById('startupTitle');if(startupTitle)startupTitle.textContent=name;const startupLogo=document.getElementById('startupLogo');if(startupLogo)startupLogo.innerHTML=logo?'<img src="'+esc(logo)+'" alt="Logo">':'<span class="startup-logo-fallback">DC</span>';const marks=document.querySelectorAll('.login-brand .brandmark,.sidebar .brandmark');marks.forEach(lb=>{lb.innerHTML=logo?'<img src="'+esc(logo)+'" alt="Tuition logo">':'DC'})}
function updateShell(){if(!currentUser)return;applyBranding();document.getElementById('brandName').textContent=db.settings.name;document.getElementById('profileName').textContent=currentUser.name;document.getElementById('profileRole').textContent=labelRole(currentUser.role);document.getElementById('profileAvatar').innerHTML=esc((currentUser.name||'U')[0].toUpperCase())}
function refreshSessionUser(){if(!currentUser)return;const u=resolveUser(currentUser.id);if(u){currentUser=u;updateShell()}}
const BACKUP_KEY='dce_tuition_backup_v4';
function backupPayload(){return {format:'DCE-Tuition-Backup',version:4,createdAt:new Date().toISOString(),app:'Talim Coaching Center',data:clone(db)}}
function createBackupSnapshot(downloadFile=true){try{const payload=backupPayload();localStorage.setItem(BACKUP_KEY,JSON.stringify(payload));localStorage.setItem(BACKUP_KEY+'_time',payload.createdAt);if(downloadFile){if(typeof XLSX==='undefined')throw new Error('Excel service unavailable');const wb=XLSX.utils.book_new();const sheets={Students:db.students,Teachers:db.teachers,Batches:db.batches,Payments:db.payments,Attendance:db.attendance,Marks:db.marks,Expenses:db.expenses,'Fee History':db.feeHistory,Users:db.users,Notices:db.notices,Materials:db.materials,Messages:db.messages,'Fee Cycles':db.feeCycles,Promotions:db.promotions,Activity:db.activity,Settings:[db.settings]};Object.entries(sheets).forEach(([name,data])=>{const ws=XLSX.utils.json_to_sheet(data||[]);XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))});XLSX.writeFile(wb,(db.settings.name||'Tuition')+'_Backup_'+today()+'.xlsx')}return true}catch(e){console.error(e);toast('Backup could not be created');return false}}
async function restoreBackupObject(payload,label){if(!payload||typeof payload!=='object')throw new Error('Invalid backup');const data=payload.data||payload;if(!data||!Array.isArray(data.students)||!Array.isArray(data.payments))throw new Error('Invalid tuition backup');db={...clone(defaults),...data,settings:{...clone(defaults.settings),...(data.settings||{})}};db.settings.permissions={teacher:{...DEFAULT_PERMISSIONS.teacher,...(data.settings?.permissions?.teacher||{})},student:{...DEFAULT_PERMISSIONS.student,...(data.settings?.permissions?.student||{})}};localStorage.setItem(KEY,JSON.stringify(db));activity('Backup restored',label||'Backup file');localStorage.setItem(KEY,JSON.stringify(db));updateShell();buildNav();render();toast('Backup restored locally — syncing cloud…');const ok=await cloudForceSaveAll();toast(ok?'Backup restored successfully to Google Sheets':'Backup restored locally; cloud sync failed — please check connection');}
function restoreLastBackup(){try{const raw=localStorage.getItem(BACKUP_KEY);if(!raw){toast('No local backup found');return}restoreBackupObject(JSON.parse(raw),'Local backup')}catch(e){console.error(e);toast('Local backup could not be restored')}}
function restoreBackupFile(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{restoreBackupObject(JSON.parse(reader.result),file.name)}catch(err){console.error(err);toast('Invalid backup file')}};reader.readAsText(file);e.target.value=''}
function clearLocalBackup(){if(confirm('Delete the saved local backup? This will not delete your tuition data.')){localStorage.removeItem(BACKUP_KEY);localStorage.removeItem(BACKUP_KEY+'_time');render();toast('Local backup cleared')}}
async function resetAndRestoreBackup(){if(!currentUser||currentUser.role!=='admin')return;if(!confirm('Reset ALL tuition data? All students, teachers, batches, payments, messages and records will be permanently cleared from this device AND Google Sheets. Sheet tabs will remain.'))return;try{toast('Clearing Google Sheets…');const cloudOk=await cloudResetAll();if(!cloudOk){toast('Cloud reset failed — nothing was cleared locally. Please check connection and try again.');return}db=clone(defaults);db.settings.permissions=clone(DEFAULT_PERMISSIONS);localStorage.setItem(KEY,JSON.stringify(db));localStorage.removeItem('dce_session_user');sessionStorage.removeItem('dce_user');currentUser=null;cloudLastSnapshot=clone(db);toast('System reset completed — Google Sheets are empty');setTimeout(()=>location.reload(),350)}catch(e){console.error(e);toast('System reset failed')}}
function canView(page){if(!currentUser||currentUser.role==='admin')return true;const up=db.settings.userPermissions?.[currentUser.id];if(up&&Object.prototype.hasOwnProperty.call(up,page))return !!up[page];return !!(db.settings.permissions?.[currentUser.role]?.[page])}
function confirmSignOut(){modal('Sign out','<p style="margin:0;color:var(--muted)">Are you sure you want to sign out?</p>','<button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="logout()">Sign out</button>')}
function uid(prefix){return prefix+Date.now().toString(36).slice(-7).toUpperCase()+Math.floor(Math.random()*90+10)}
function money(n){return (db.settings.currency||'₹')+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0})}
function istDateTime(ts){const n=Number(ts);if(!n)return '';try{return new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date(n))}catch(e){return new Date(n).toLocaleString('en-IN')}}
function istDate(ts){const n=Number(ts);if(!n)return '';try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(n))}catch(e){return today()}}
function renderChatBubble(m){const mine=m.fromId===currentUser.id;const when=m.dateTs?istDateTime(m.dateTs):(m.date||'');const del=canDeleteMessages()?'<button class="btn small danger" style="margin-top:7px" onclick="openScopedDelete(&quot;messages&quot;,&quot;'+m.id+'&quot;)">Delete</button>':'';return '<div class="chat-row '+(mine?'mine':'')+'"><div class="chat-bubble"><div class="chat-bubble-name">'+esc(mine?'You':(m.fromName||'Unknown'))+'</div><div>'+esc(m.message||'')+'</div><small>'+esc(when)+(m.subject&&m.subject!=='Message'?' · '+esc(m.subject):'')+'</small>'+del+'</div></div>'}
function displayDate(v){
  if(v===null||v===undefined||v==='')return '';
  let s=String(v).trim();if(!s)return '';
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return m[3]+'-'+m[2]+'-'+m[1];
  m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return String(m[3]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0')+'-'+m[1];
  const d=new Date(s);if(isNaN(d))return s;
  return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',day:'2-digit',month:'2-digit',year:'numeric'}).format(d);
}
function today(){return istDate(Date.now())}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function dateObj(v){const d=new Date((v||today())+'T00:00:00');return isNaN(d)?new Date():d}
function fmtDate(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function addMonthsSafe(date,months){const d=new Date(date);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+months);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d}
function daysInPeriod(a,b){return Math.max(1,Math.round((dateObj(b)-dateObj(a))/86400000)+1)}
function ensureFeeCycles(){
  if(!Array.isArray(db.feeCycles))db.feeCycles=[];
  let changed=false;const todayDate=dateObj(today());
  db.students.filter(s=>s.status!=='left').forEach(s=>{
    let start=dateObj(s.feeStartDate||s.admissionDate||s.createdAt||today());
    if(start>todayDate)return;
    let first=true,idx=0;
    while(start<=todayDate&&idx<120){
      let end,full=Number(s.fee||0),amount=full;
      if(first&&start.getDate()!==1){
        end=new Date(start.getFullYear(),start.getMonth()+1,0);
        amount=Math.round(full*daysInPeriod(start,end)/end.getDate());
      }else end=new Date(start.getFullYear(),start.getMonth()+1,0);
      let key=s.id+'|'+fmtDate(start),c=db.feeCycles.find(x=>x.key===key);
      if(!c){
        c={id:uid('CYC'),key,studentId:s.id,studentName:s.name,className:s.className,batch:s.batch||'',startDate:fmtDate(start),endDate:fmtDate(end),amount,paid:0,manualReduction:0,status:'accruing',createdAt:today()};
        db.feeCycles.push(c);changed=true;
      }else{
        c.studentName=s.name;c.className=s.className;c.batch=s.batch||'';c.amount=Number(c.amount||amount);c.manualReduction=Number(c.manualReduction||0);
      }
      updateCycleStatus(c);
      start=new Date(end);start.setDate(start.getDate()+1);first=false;idx++;
    }
  });
  return changed;
}
function cycleDue(c){if(!c||dateObj(c.endDate)>dateObj(today()))return 0;return Math.max(0,Number(c.amount||0)-Number(c.paid||0)-Number(c.manualReduction||0))}
function updateCycleStatus(c){if(!c)return;const future=dateObj(c.endDate)>dateObj(today());if(future)c.status='accruing';else{const due=cycleDue(c);if(due<=0)c.status='paid';else if(Number(c.paid||0)>0||Number(c.manualReduction||0)>0)c.status='partial';else c.status='pending'}}
function rebuildFeeCyclePaid(studentId){ensureFeeCycles();db.feeCycles.filter(c=>c.studentId===studentId).forEach(c=>c.paid=0);db.payments.filter(p=>p.studentId===studentId).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(p=>allocatePaymentToCyclesRaw(studentId,Number(p.amount||0)));db.feeCycles.filter(c=>c.studentId===studentId).forEach(updateCycleStatus)}
function allocatePaymentToCyclesRaw(studentId,amount){let left=Number(amount||0);db.feeCycles.filter(c=>c.studentId===studentId&&dateObj(c.endDate)<=dateObj(today())).sort((a,b)=>String(a.startDate).localeCompare(String(b.startDate))).forEach(c=>{if(left<=0)return;let due=Math.max(0,Number(c.amount||0)-Number(c.paid||0)-Number(c.manualReduction||0));let take=Math.min(left,due);if(take>0){c.paid=Number(c.paid||0)+take;updateCycleStatus(c);left-=take}});return left}
function allocatePaymentToCycles(studentId,amount){ensureFeeCycles();return allocatePaymentToCyclesRaw(studentId,amount)}

function messageVisibleFor(m,role){
  if(role==='student') return !m.deletedStudent;
  if(role==='teacher') return !m.deletedTeacher;
  return true;
}
function messageStudentId(m){return m.fromRole==='student'?m.fromId:(m.toRole==='student'?m.toId:'')}
function messageStudent(m){let id=messageStudentId(m);return db.students.find(s=>s.id===id)||null}
function messageClass(m){let s=messageStudent(m);return s?.className||m.className||''}
function messageTeacherId(m){return m.fromRole==='teacher'?m.fromId:(m.toRole==='teacher'?m.toId:'')}
function canDeleteContent(type,role){
  if(!currentUser)return false;
  if(currentUser.role==='admin')return true;
  const key=type==='messages'?'messageDelete':type==='notices'?'noticeDelete':'materialDelete';
  const up=db.settings.userPermissions?.[currentUser.id];
  if(up&&Object.prototype.hasOwnProperty.call(up,key))return !!up[key];
  return !!db.settings.permissions?.[currentUser.role]?.[key];
}
function canDeleteMessages(){return canDeleteContent('messages',currentUser?.role)}
function canDeleteNotices(){return canDeleteContent('notices',currentUser?.role)}
function canDeleteMaterials(){return canDeleteContent('materials',currentUser?.role)}
function scopedVisible(item,role){
  if(role==='student')return !item.deletedStudent;
  if(role==='teacher')return !item.deletedTeacher;

}
function openScopedDelete(type,id){
  if(!canDeleteContent(type,currentUser?.role)){toast('You do not have delete permission');return}
  const labels=type==='messages'?'message':type==='notices'?'notice':'material';
  const item=(db[type]||[]).find(x=>String(x.id)===String(id));
  if(!item)return;
  const btn=(target,label,cls='')=>'<button class="btn small '+cls+'" onclick="performScopedDelete(\''+type+'\',\''+id+'\',\''+target+'\')">'+label+'</button>';
  modal('Delete '+labels,'<div class="info-box"><b>'+esc(item.title||item.subject||item.fileName||labels)+'</b><br><small>Choose where this '+labels+' should be removed.</small></div><div class="actions" style="margin-top:14px;display:grid;gap:8px">'+btn('student','Delete from Students')+btn('teacher','Delete from Teachers')+(currentUser.role==='admin'?btn('all','Delete Everywhere','danger'):'')+'</div>','<button class="btn" onclick="closeModal()">Cancel</button>');
}
async function performScopedDelete(type,id,target){
  if(!canDeleteContent(type,currentUser?.role)){toast('You do not have delete permission');return}
  if(target==='all'&&currentUser.role!=='admin'){toast('Only admin can delete everywhere');return}
  const label=target==='all'?'everywhere':target==='student'?'from students':'from teachers';
  if(!confirm('Delete this '+(type==='messages'?'message':type==='notices'?'notice':'material')+' '+label+'?'))return;
  const arr=db[type]||[]; const item=arr.find(x=>String(x.id)===String(id)); if(!item)return;
  if(target==='all'){db[type]=arr.filter(x=>String(x.id)!==String(id));}
  else if(target==='student')item.deletedStudent=true;
  else if(target==='teacher')item.deletedTeacher=true;
  activity((type==='messages'?'Message':type==='notices'?'Notice':'Material')+' deleted '+label,item.title||item.subject||item.fileName||id);
  localStorage.setItem(KEY,JSON.stringify(db)); closeModal(); render(); buildNav(); toast('Deleted '+label);
  await cloudPatch('deleteScoped',{table:type,id,target});
}

function messageRecipientOptions(role){
  let a=[];
  if(role==='admin'){
    a=db.students.filter(s=>s.status!=='left').map(s=>({id:s.id,role:'student',name:s.name,label:'Student'}))
      .concat(db.teachers.filter(t=>t.active!==false).map(t=>({id:t.id,role:'teacher',name:t.name,label:'Teacher'})))
      .concat(db.users.filter(u=>u.active!==false&&u.id!==currentUser.id&&u.role==='admin').map(u=>({id:u.id,role:'admin',name:u.name,label:'Admin'})));
  }else if(role==='teacher'){
    a=db.students.filter(s=>s.status!=='left').map(s=>({id:s.id,role:'student',name:s.name,label:'Student'}))
      .concat(db.users.filter(u=>u.active!==false&&u.role==='admin').map(u=>({id:u.id,role:'admin',name:u.name,label:'Admin'})));
  }
  return a;
}

async function deleteMessageFor(id,target){
  let m=db.messages.find(x=>x.id===id);if(!m)return;
  if(target==='all'){
    if(currentUser.role!=='admin'){toast('Only admin can delete a message everywhere');return}
    if(!confirm('Delete this message permanently for everyone?'))return;
    db.messages=db.messages.filter(x=>x.id!==id);
    activity('Message deleted entirely',m.subject||m.id);
  }else{
    /* Student delete = hide from teacher; Teacher delete = hide from student. Admin can explicitly hide either side. */
    let effective=target;
    if(currentUser.role==='student')effective='teacher';
    if(currentUser.role==='teacher')effective='student';
    let label=effective==='student'?'student':'teacher';
    if(!confirm('Delete this message from the '+label+' side?'))return;
    if(effective==='student')m.deletedStudent=true;
    if(effective==='teacher')m.deletedTeacher=true;
    activity('Message deleted for '+label,m.subject||m.id);
  }
  localStorage.setItem(KEY,JSON.stringify(db));
  render();toast(target==='all'?'Message deleted everywhere':'Message deleted');
  await cloudPatch(target==='all'?'deleteMessage':'deleteMessageFor',{id,target:(currentUser.role==='student'?'teacher':currentUser.role==='teacher'?'student':target)});
}

function studentPaidAmount(id){const st=db.students.find(x=>String(x.id)===String(id));if(!st)return 0;if(st.manualPaidOverride!==null&&st.manualPaidOverride!==undefined)return Math.max(0,Number(st.manualPaidOverride)||0);return db.payments.filter(p=>String(p.studentId)===String(id)).reduce((a,p)=>a+Math.max(0,Number(p.amount)||0),0)}
function studentDueAmount(id){const st=db.students.find(x=>String(x.id)===String(id));if(!st)return 0;if(st.manualDueOverride!==null&&st.manualDueOverride!==undefined)return Math.max(0,Number(st.manualDueOverride)||0);return feeDueForStudent(id)}
function normalizeFinancialOverrides(){(db.students||[]).forEach(st=>{const hasPaid=st.manualPaidOverride!==null&&st.manualPaidOverride!==undefined;const hasDue=st.manualDueOverride!==null&&st.manualDueOverride!==undefined;const actual=(db.payments||[]).filter(p=>String(p.studentId)===String(st.id)).reduce((a,p)=>a+Math.max(0,Number(p.amount)||0),0);st.manualPaidOverride=hasPaid?Math.max(0,Number(st.manualPaidOverride)||0):null;st.manualDueOverride=hasDue?Math.max(0,Number(st.manualDueOverride)||0):null;st.paid=hasPaid?st.manualPaidOverride:actual;});}

function sendStudent(id){openPage('communication');setTimeout(()=>{document.getElementById('msgStudent').value=id;fillMessageContact()},0)}
function getStudentMessageData(s){let payments=db.payments.filter(p=>p.studentId===s.id).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));let last=payments[0]||{};let due=Math.max(0,Number(s.fee||0)-Number(s.paid||0));let ats=db.attendance.filter(a=>a.studentId===s.id).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));let att=ats[0]||{};let marks=db.marks.filter(m=>m.studentId===s.id).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));let mark=marks[0]||{};return {amount:last.amount?money(last.amount):money(0),receipt:last.receipt||'—',due:money(due),attendance_date:att.date||today(),attendance_status:att.status||'Not recorded',result:mark.total!=null?String(mark.total):(mark.marks!=null?String(mark.marks):'Not recorded'),batch:s.batch||'—',class_name:s.className||'—',guardian:s.guardian||'—'};}
function replaceMessageTokens(text,s){let d=getStudentMessageData(s);return String(text||'').replaceAll('{student_name}',s.name).replaceAll('{amount}',d.amount).replaceAll('{receipt}',d.receipt).replaceAll('{due}',d.due).replaceAll('{attendance_date}',d.attendance_date).replaceAll('{attendance_status}',d.attendance_status).replaceAll('{result}',d.result).replaceAll('{batch}',d.batch).replaceAll('{class_name}',d.class_name).replaceAll('{guardian}',d.guardian)}
function fillMessageContact(){
  let s=db.students.find(x=>x.id===val('msgStudent'));if(!s)return;
  const type=val('msgContactType')||'student';
  document.getElementById('msgPhone').value=type==='guardian'?(s.guardianPhone||''):(s.phone||'');
  document.getElementById('msgEmail').value=type==='guardian'?'':(s.email||'');
  let sel=document.getElementById('msgTemplate');if(sel&&sel.value)useTemplate(sel.value);
}
function useTemplate(type){let t=document.getElementById('msgText');let s=db.students.find(x=>x.id===val('msgStudent'));if(!t||!s)return;let map={payment:'Dear {student_name}, your payment of {amount} has been received. Receipt: {receipt}. Your current outstanding fee is {due}. Thank you.',reminder:'Dear {student_name}, your current outstanding fee is {due}. Please clear the due at your convenience.',attendance:'Dear {student_name}, your latest attendance on {attendance_date} is marked as {attendance_status}.',absence:'Dear {student_name}, you were marked absent on {attendance_date}. Please contact your teacher if you were unable to attend.',notice:'Dear {student_name}, please check the latest notice from your tuition.',welcome:'Welcome to '+(db.settings.name||'our tuition')+', {student_name}. Your class is {class_name} and your batch is {batch}.',result:'Dear {student_name}, your latest recorded result is {result}. Please contact your teacher for details.',batch:'Dear {student_name}, your current batch is {batch}. Class: {class_name}.'};t.value=replaceMessageTokens(map[type]||'',s)}
function sendChannel(ch){
  let s=db.students.find(x=>x.id===val('msgStudent'));if(!s){toast('Select a student');return}
  let type=val('msgContactType')||'student',phone=val('msgPhone')||(type==='guardian'?s.guardianPhone:s.phone),email=type==='guardian'?'':s.email,text=replaceMessageTokens(val('msgText'),s),url;
  if(ch==='whatsapp'){if(!phone){toast('No '+(type==='guardian'?'guardian':'student')+' phone saved');return}url='https://wa.me/'+phone.replace(/\D/g,'')+'?text='+encodeURIComponent(text)}
  else if(ch==='email'){if(!email){toast('No student email saved');return}url='mailto:'+email+'?subject='+encodeURIComponent(db.settings.name)+'&body='+encodeURIComponent(text)}
  else{if(!phone){toast('No '+(type==='guardian'?'guardian':'student')+' phone saved');return}url='sms:'+phone.replace(/\D/g,'')+'?body='+encodeURIComponent(text)}
  window.open(url,'_blank');activity('Message prepared',s.name+' · '+type+' · '+ch);save()
}

function downloadReceiptPDF(id){let p=db.payments.find(x=>x.id===id),s=db.students.find(x=>x.id===p?.studentId);if(!p||!s)return;if(!window.jspdf?.jsPDF){toast('PDF service unavailable');return}let {jsPDF}=window.jspdf,doc=new jsPDF();doc.setTextColor(8,124,110);doc.setFontSize(20);doc.text(db.settings.name||'Tuition Management',20,25);doc.setTextColor(23,51,46);doc.setFontSize(15);doc.text('Payment Receipt',20,38);doc.setFontSize(11);let rows=[['Receipt',p.receipt],['Student',s.name],['Student ID',s.id],['Date',p.date],['Amount',money(p.amount)],['Mode',p.mode]];let y=55;rows.forEach(r=>{doc.setFont(undefined,'bold');doc.text(r[0],20,y);doc.setFont(undefined,'normal');doc.text(String(r[1]??''),75,y);doc.line(20,y+3,190,y+3);y+=12});doc.setFontSize(10);doc.text('Thank you.',20,y+15);doc.save((p.receipt||'receipt')+'.pdf');toast('Receipt PDF downloaded')}
function historyTable(a){return '<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Student</th><th>Old Fee</th><th>New Fee</th><th>Reason</th><th>Action</th></tr></thead><tbody>'+(a.length?a.map(h=>'<tr><td>'+displayDate(h.date)+'</td><td><b>'+esc(h.studentName)+'</b><br><small>'+esc(h.studentId)+'</small></td><td>'+money(h.oldFee)+'</td><td>'+money(h.newFee)+'</td><td>'+esc(h.reason||'Fee revision')+'</td><td><button class="btn small" onclick="editFeeHistory(\''+h.id+'\')">Edit</button><button class="btn small danger" onclick="deleteFeeHistory(\''+h.id+'\')">Delete</button></td></tr>').join(''):'<tr><td colspan="6"><div class="empty">No fee history found</div></td></tr>')+'</tbody></table></div>'}
function editFeeHistory(id){const h=db.feeHistory.find(x=>x.id===id);if(!h)return;modal('Edit Fee History','<div class="form-grid"><div class="field"><label>Date</label><input id="fhDate" type="date" value="'+esc(h.date||today())+'"></div><div class="field"><label>Old Fee</label><input id="fhOld" type="number" min="0" value="'+Number(h.oldFee||0)+'"></div><div class="field"><label>New Fee</label><input id="fhNew" type="number" min="0" value="'+Number(h.newFee||0)+'"></div><div class="field"><label>Reason</label><input id="fhReason" value="'+esc(h.reason||'Fee revision')+'"></div></div>','<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveFeeHistoryEdit(\''+id+'\')">Save Changes</button>')}

function openEditPayment(id){const p=db.payments.find(x=>x.id===id);if(!p)return;modal('Edit Payment','<div class="info-box"><b>'+esc(p.receipt)+'</b><br>'+esc(p.studentName)+' · '+esc(p.studentId)+'</div><div class="form-grid" style="margin-top:14px"><div class="field"><label>Amount</label><input id="epAmount" type="number" min="0" value="'+Number(p.amount||0)+'"></div><div class="field"><label>Date</label><input id="epDate" type="date" value="'+esc(p.date||today())+'"></div><div class="field"><label>Payment Mode</label><select id="epMode"><option '+(p.mode==='Cash'?'selected':'')+'>Cash</option><option '+(p.mode==='UPI'?'selected':'')+'>UPI</option><option '+(p.mode==='Bank'?'selected':'')+'>Bank</option><option '+(p.mode==='Other'?'selected':'')+'>Other</option></select></div><div class="field"><label>Note</label><input id="epNote" value="'+esc(p.note||'')+'"></div></div>','<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEditPayment(\''+id+'\')">Save Changes</button>')}

function downloadStudentHistoryPDF(id){const s=db.students.find(x=>x.id===id);if(!s||!window.jspdf?.jsPDF){toast('PDF service unavailable');return}const {jsPDF}=window.jspdf,doc=new jsPDF();doc.setFontSize(18);doc.text(db.settings.name||'Tuition Management',20,20);doc.setFontSize(14);doc.text('Student Complete History',20,31);doc.setFontSize(10);let y=43;['Name: '+s.name,'Student ID: '+s.id,'Admission Date: '+(s.admissionDate||s.createdAt||'—'),'Class: '+(s.className||'—'),'Batch: '+(s.batch||'—'),'Monthly Fee: '+money(s.fee)].forEach(t=>{doc.text(t,20,y);y+=7});y+=4;doc.text('Fee Cycles',20,y);y+=7;db.feeCycles.filter(c=>c.studentId===id).forEach(c=>{if(y>275){doc.addPage();y=20}doc.text((c.startDate||'')+' → '+(c.endDate||'')+' | Amount '+money(c.amount)+' | Paid '+money(c.paid)+' | Due '+money(cycleDue(c)),20,y);y+=6});y+=5;doc.text('Payments',20,y);y+=7;db.payments.filter(p=>p.studentId===id).forEach(p=>{if(y>275){doc.addPage();y=20}doc.text((p.date||'')+' | '+(p.receipt||'')+' | '+money(p.amount)+' | '+(p.mode||''),20,y);y+=6});doc.save((s.id||'student')+'_history.pdf');toast('Student history PDF downloaded')}

async function saveSettings(){
  db.settings.name=val('setName')||db.settings.name||DEFAULT_APP_NAME;
  db.settings.session=val('setSession')||db.settings.session||'2026-27';
  db.settings.currency=val('setCurrency')||db.settings.currency||'₹';
  const logoInput=document.getElementById('setLogo');
  if(logoInput?.dataset.logoData)db.settings.logo=logoInput.dataset.logoData;
  db.settings.permissions=db.settings.permissions||clone(DEFAULT_PERMISSIONS);
  db.settings.userPermissions=db.settings.userPermissions||{};
  document.querySelectorAll('[data-role-perm]').forEach(el=>{const role=el.dataset.role,k=el.dataset.key;db.settings.permissions[role]=db.settings.permissions[role]||{};db.settings.permissions[role][k]=el.checked});
  document.querySelectorAll('[data-user-perm]').forEach(el=>{const uid=el.dataset.userId,k=el.dataset.key;db.settings.userPermissions[uid]=db.settings.userPermissions[uid]||{};db.settings.userPermissions[uid][k]=el.checked});
  activity('Settings updated',db.settings.name);
  updateShell();buildNav();render();toast('Saving to Google Sheets…');
  const ok=await cloudForceSaveAll();
  if(ok){applyBranding();toast('Settings saved permanently');}else toast('Cloud save failed — settings were NOT discarded');
}

function filterRenderedSearch(el,key){
  const value=(el.value||'').trim().toLowerCase();
  if(key==='searchTerm')searchTerm=el.value||'';else window[key]=el.value||'';
  const targets=document.querySelectorAll('[data-search-results="'+key+'"]');
  if(targets.length){targets.forEach(container=>Array.from(container.children).forEach(item=>{const empty=item.querySelector?.('.empty');if(empty){item.style.display=value?'none':'';return}item.style.display=!value||item.textContent.toLowerCase().includes(value)?'':'none'}));return}
  const card=el.closest('.card')||document.getElementById('content');
  const rows=card?card.querySelectorAll('tbody tr'):[];
  if(rows.length){rows.forEach(row=>{const empty=row.querySelector('.empty');if(empty){row.style.display=value?'none':'';return}row.style.display=!value||row.textContent.toLowerCase().includes(value)?'':'none'});return}
}

function livePageSearch(el,key){filterRenderedSearch(el,key)}
function liveStudentSearch(el){searchTerm=el.value||'';filterRenderedSearch(el,'searchTerm')}

function restoreSearchFocus(selector,pos){const n=document.querySelector(selector);if(n){try{n.focus({preventScroll:true});if(typeof pos==='number'&&n.setSelectionRange)n.setSelectionRange(pos,pos)}catch(e){}}}

function globalSearch(q){
  searchTerm=q||'';
  if(!searchTerm){
    if(currentPage==='students')render();
    return;
  }
  const needle=searchTerm.toLowerCase();
  const compact=needle.replace(/\s+/g,'');
  const studentHit=db.students.some(s=>
    [s.id,s.name,s.phone,s.className,s.batch,s.guardian].join(' ').toLowerCase().includes(needle) ||
    String(s.id||'').toLowerCase().endsWith(compact)
  );
  if(studentHit){
    currentPage='students';
    buildNav();
    document.getElementById('crumb').textContent='Students';
    render();
    return;
  }
  const pages=[
    ['payments',db.payments,['receipt','studentName','studentId']],
    ['batches',db.batches,['name','className','schedule']],
    ['teachers',db.teachers,['name','id','username']],
    ['notices',db.notices,['title','message']]
  ];
  const hit=pages.find(([p,a,keys])=>
    a.some(o=>keys.some(k=>String(o[k]||'').toLowerCase().includes(needle)))
  );
  if(hit){
    currentPage=hit[0];
    buildNav();
    document.getElementById('crumb').textContent=hit[0][0].toUpperCase()+hit[0].slice(1);
    render();
  }else if(currentPage==='students'){
    render();
  }
}

function exportExcel(){if(typeof XLSX==='undefined'){toast('Excel service is unavailable');return}try{const wb=XLSX.utils.book_new();const sheets={Students:db.students,Teachers:db.teachers,Batches:db.batches,Payments:db.payments,Attendance:db.attendance,Marks:db.marks,Expenses:db.expenses,'Fee History':db.feeHistory,Users:db.users,Notices:db.notices,Materials:db.materials,Messages:db.messages,'Fee Cycles':db.feeCycles,Promotions:db.promotions,Activity:db.activity,Settings:[db.settings]};Object.entries(sheets).forEach(([name,data])=>{const ws=XLSX.utils.json_to_sheet(data||[]);ws['!cols']=Object.keys((data&&data[0])||{}).map(()=>({wch:18}));XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))});const out=(db.settings.name||'Tuition').replace(/[^a-z0-9_-]+/gi,'_')+'_Management_'+today()+'.xlsx';XLSX.writeFile(wb,out);toast('Excel workbook downloaded')}catch(e){console.error(e);toast('Excel download failed')}}
function importExcel(e){const file=e.target.files?.[0];if(!file)return;if(typeof XLSX==='undefined'){toast('Excel service is unavailable');return}const reader=new FileReader();reader.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'});createBackupSnapshot(false);const map={Students:'students',Teachers:'teachers',Batches:'batches',Payments:'payments',Attendance:'attendance',Marks:'marks',Expenses:'expenses','Fee History':'feeHistory',Users:'users',Notices:'notices',Materials:'materials',Messages:'messages','Fee Cycles':'feeCycles',Promotions:'promotions',Activity:'activity'};Object.entries(map).forEach(([sheet,key])=>{if(wb.Sheets[sheet])db[key]=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{defval:''})});if(wb.Sheets.Settings){const rows=XLSX.utils.sheet_to_json(wb.Sheets.Settings,{defval:''});if(rows[0])db.settings={...db.settings,...rows[0]}}db.messages=(db.messages||[]).map(m=>({...m,dateTs:Number(m.dateTs||Date.now()),fromRole:m.fromRole||((db.students||[]).some(s=>s.id===m.fromId)?'student':((db.teachers||[]).some(t=>t.id===m.fromId)?'teacher':'admin')),toRole:m.toRole||((db.students||[]).some(s=>s.id===m.toId)?'student':((db.teachers||[]).some(t=>t.id===m.toId)?'teacher':'admin')),deletedStudent:Boolean(m.deletedStudent),deletedTeacher:Boolean(m.deletedTeacher)}));save();activity('Excel restored',file.name);save();toast('Workbook restored successfully');render()}catch(err){console.error(err);toast('Could not restore this workbook')}};reader.readAsArrayBuffer(file);e.target.value=''}

function visibleMaterials(){
  if(!currentUser)return [];
  if(currentUser.role==='admin'||currentUser.role==='teacher')return (Array.isArray(db.materials)?db.materials:[]).filter(m=>scopedVisible(m,currentUser.role));
  const s=studentSelf();
  if(!s)return [];
  return (Array.isArray(db.materials)?db.materials:[]).filter(m=>scopedVisible(m,currentUser.role)).filter(m=>{
    const a=m.audience||'all', t=m.target||'';
    return a==='all'||a==='teachers' ? a==='all' :
      a==='class' ? String(t)===String(s.className) :
      a==='batch' ? String(t)===String(s.batch) :
      a==='student' ? String(t)===String(s.id) : false;
  });
}
